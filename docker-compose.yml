
services:

  redis:
    image: redis:7.0.11-alpine
  
  django:
    image: eshop_django
    container_name: django-celery-project
    build: 
      context: ./eshop
      dockerfile: Dockerfile
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./eshop:/app
    ports:
      - "8000:8000"
    environment:
      - ALLOWED_HOSTS=localhost,127.0.0.1
      - DEBUG=True
      - SECRET_KEY=dcdcshsj@xsx

    depends_on:
      - redis


  celery:
    container_name: celery
    build: 
      context: ./eshop
      dockerfile: Dockerfile
    command: celery --app=config.celery:app worker -l INFO
    volumes:
      - ./eshop:/app

    environment:
      - ALLOWED_HOSTS=localhost,127.0.0.1
      - DEBUG=True
      - SECRET_KEY=dcdcshsj@xsx

    depends_on:
      - redis
    